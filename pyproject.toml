[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-pregame-models"
version = "0.1.0"
description = "Shared NBA team and player-prop pregame model utilities"
readme = "PACKAGING.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "lightgbm>=4,<5",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
training = ["FLAML>=2,<3", "matplotlib>=3.8,<4"]
collection = ["backoff>=2,<3", "beautifulsoup4>=4.12,<5", "nba_api>=1.11,<2", "pdfplumber>=0.11,<1", "sbrscrape>=0.0.10,<1"]
test = ["pytest>=8,<10"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "core.*", "team", "team.*", "props", "props.*"]
exclude = ["props.polymarket", "props.polymarket.*"]
namespaces = false

[tool.setuptools.package-data]
core = ["live_feed_overrides.csv"]
