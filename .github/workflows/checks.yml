name: Checks
# Production inference runs locally on a Windows Task Scheduler job (scripts/run_daily_inference.bat,
# daily 9:15 AM PT from 2026-10-20): it needs data/nba_stats.db and the injury-report archive, which
# are gitignored and too large for the repo. This workflow only checks that the code imports and
# that key date/cutoff logic is correct - no database or network needed. The pytest suite runs here too:
# tests marked "db" (train/serve parity on the real database) skip themselves when data/nba_stats.db is absent.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # The dashboard tests run the real pages and skip without these two packages. Versions are the ones of the local test environment;
      # the dashboards' own requirements files are not installed here because they pin an older pandas and numpy for Streamlit Cloud.
      - run: pip install streamlit==1.66.1 plotly==5.24.1
      - run: python -m compileall -q core team props scripts
      - run: python scripts/smoke_check.py
      - run: python -m pytest tests -q -ra
